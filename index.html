<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор базових станцій</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="sidebar">
        <h3>Редактор базових станцій</h3>
        <div class="save-load-buttons">
            <button type="button" id="save-json">Зберегти дані</button>
            <button type="button" id="load-json">Завантажити дані</button>
            <button type="button" id="export-geojson" title="Експорт у GeoJSON">GeoJSON</button>
            <button type="button" id="export-kml" title="Експорт у KML (Google Earth)">KML</button>
            <input type="file" id="file-input" accept=".json,application/json" hidden>
        </div>
        <div class="default-settings">
            <h4>Глобальні налаштування</h4>
            <div class="setting-item">
                <label for="default-font-size">Розмір тексту (px):</label>
                <input type="number" id="default-font-size" value="12" min="6" max="20">
            </div>
            <div class="setting-item">
                <label for="default-color">Колір азимутів:</label>
                <input type="color" id="default-color" value="#000000">
            </div>
            <div class="setting-item">
                <label for="default-marker-size">Розмір маркера: <span id="default-marker-size-value">17</span> px</label>
                <input type="range" id="default-marker-size" min="0" max="8" step="1" value="2" style="width:100%;">
            </div>
            <div class="setting-item">
                <label for="default-radius">Радіус азимутів (м):</label>
                <input type="number" id="default-radius" value="700" min="100" max="90000" step="50">
            </div>
            <div class="setting-item">
                <label for="default-width">Ширина азимутів:</label>
                <input type="number" id="default-width" value="120" min="30" max="360" step="5">
            </div>
            <div class="setting-item">
                <label for="default-popup-distance">Відступ інфобокса:</label>
                <input type="number" id="default-popup-distance" value="250" min="50" max="500" step="10">
            </div>
            <div class="setting-item">
                <label>Геокодувати нові станції:</label>
                <div class="checkbox-item">
                    <input type="checkbox" id="default-geocode" checked>
                    <label for="default-geocode">Так</label>
                </div>
            </div>
            <div class="setting-item">
                <label>Стиль тексту:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="default-bold">
                        <label for="default-bold">Жирний</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="default-italic">
                        <label for="default-italic">Курсив</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="list-header">
            <h4>Станції: <span id="station-count">0</span></h4>
            <input type="search" id="station-filter" placeholder="Фільтр за назвою чи адресою" aria-label="Фільтр станцій">
        </div>
        <div id="station-list"></div>
    </div>
    <div id="map">
        <div id="button-container">
            <button type="button" id="undo" title="Скасувати (Ctrl+Z)" disabled>Скасувати</button>
            <button type="button" id="redo" title="Повторити (Ctrl+Y)" disabled>Повторити</button>
            <button type="button" id="delete-all">Видалити все</button>
            <button type="button" id="toggle-sidebar" aria-expanded="true" aria-controls="sidebar">Згорнути панель</button>
        </div>
    </div>
    <div class="search-container">
        <input type="search" id="search-input" placeholder="Пошук адреси..." aria-label="Пошук адреси" autocomplete="off">
        <div id="search-results" role="listbox" hidden></div>
    </div>
    <div id="geocode-indicator">
        <div class="spinner-circle">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/validate.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/export.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/map.js"></script>
    <script src="js/geocoding.js"></script>
    <script src="js/stations.js"></script>
    <script src="js/history.js"></script>
    <script src="js/settings-ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
